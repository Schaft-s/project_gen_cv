model_id: google/ddpm-cifar10-32
num_train_timesteps: 1000
beta_start: 0.0001
beta_end: 0.02
beta_schedule: linear
prediction_type: epsilon
variance_type: fixed_large
image_size: 32
channels: 3
dtype: float32

# MATCH: copy Diffusers defaults for that scheduler, including clip_sample=true.
# RESEARCH: disable internal clipping/thresholding; clamp only at final decode.
clip_sample_match: true
clip_sample_research: false
clip_sample_range: 1.0

ddim:
  eta: 0.0
  timestep_spacing: leading

heun:
  s_churn: 0.0
  clip_sample_match: true

dpm:
  algorithm_type: dpmsolver++
  solver_order: 2
  solver_type: midpoint
  lower_order_final: true
  euler_at_final: false
  final_sigmas_type: zero
  thresholding: false

nfe_budgets: [9, 19, 39]
karras_rho: 7.0

seeds:
  master: 0
  noise_bank: 0

splits:
  search: 32
  valid: 64
  mse_test: 256
  fid: 5000
  fid_fallback: 2000
  ref_stability: 16

reference:
  sampler: ddim
  nfe: 1000
  stability_nfes: [250, 500, 1000]

search:
  sampler: dpm_pp_2m
  nfe: 19
  n_anchors: 3
  log_sigma_shifts: [0.20, 0.10, 0.05]
  base: karras

match:
  atol_step: 1.0e-5
  atol_traj: 1.0e-4
  n_images: 4
  n_steps: 20

batch_size_local: 16
batch_size_colab: 64
