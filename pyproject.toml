[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gencv"
version = "0.1.0"
description = "CIFAR-10 diffusion samplers: DDIM, DPM-Solver++ 2M, Heun, and noise-schedule search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "diffusers==0.32.2",
  "transformers>=4.44.0,<5",
  "accelerate>=0.34.0",
  "safetensors",
  "huggingface-hub>=0.34.0,<1",
  "numpy",
  "pillow",
  "matplotlib",
  "tqdm",
  "pyyaml",
  "clean-fid",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
